name: Bootstrap standalone OIA repository

on:
  push:
    branches:
      - release/oia-standalone-v2.2.1-20260902
    paths:
      - .github/workflows/00-bootstrap-standalone.yml

permissions:
  contents: write

jobs:
  migrate-repair-and-materialise:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/oia-standalone-v2.2.1-20260902
          fetch-depth: 0

      - name: Retrieve the exact portfolio-hosted OIA source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/oia-source
          git clone --filter=blob:none --no-checkout https://github.com/Sajeevanveeriah/sajeevanveeriah.github.io.git /tmp/oia-source
          git -C /tmp/oia-source fetch origin 9db11e5ff2ed097ba7ec7537aec776179e04983a --depth=1
          git -C /tmp/oia-source checkout --detach 9db11e5ff2ed097ba7ec7537aec776179e04983a
          test "$(git -C /tmp/oia-source rev-parse HEAD)" = "9db11e5ff2ed097ba7ec7537aec776179e04983a"

      - name: Port the complete product source into the standalone repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf web desktop scripts docs tests dist
          mkdir -p web desktop scripts docs/design tests .github/workflows
          cp -a /tmp/oia-source/public/open-industrial-automation/. web/
          cp -a /tmp/oia-source/desktop/. desktop/
          cp /tmp/oia-source/scripts/qa-oia-lib.mjs scripts/
          cp /tmp/oia-source/scripts/qa-oia-tests.mjs scripts/
          cp /tmp/oia-source/scripts/qa-oia.mjs scripts/
          cp /tmp/oia-source/scripts/qa-oia-products.mjs scripts/
          find /tmp/oia-source/docs/superpowers -type f -iname '*Open-Industrial-Automation*' -exec cp {} docs/design/ \;
          cp web/LICENSE LICENSE

      - name: Create standalone build, verification and release configuration
        shell: bash
        run: |
          set -euo pipefail
          cat > package.json <<'JSON'
          {
            "name": "open-industrial-automation",
            "version": "2.2.1",
            "description": "Vendor-neutral open-source industrial automation engineering, operations, MES, historian, quality, asset-care, integration and OT-governance suite.",
            "type": "module",
            "license": "Apache-2.0",
            "private": false,
            "scripts": {
              "build": "node scripts/build.mjs",
              "verify:source": "node scripts/verify-source.mjs",
              "test:web": "node scripts/qa-oia.mjs",
              "test:products": "node scripts/qa-oia-products.mjs",
              "desktop:verify": "node desktop/verify.cjs",
              "test": "npm run verify:source && npm run build && npm run test:web && npm run test:products && npm run desktop:verify"
            },
            "devDependencies": {
              "axe-core": "4.12.1",
              "playwright": "1.62.0"
            }
          }
          JSON

          cat > scripts/build.mjs <<'JS'
          import { cp, mkdir, rm, writeFile } from 'node:fs/promises'
          import { resolve } from 'node:path'

          const source = resolve('web')
          const target = resolve('dist')
          await rm(target, { recursive: true, force: true })
          await mkdir(target, { recursive: true })
          await cp(source, target, { recursive: true })
          await writeFile(resolve(target, '.nojekyll'), '\n', 'utf8')
          console.log(`Built standalone web distribution at ${target}`)
          JS

          cat > scripts/verify-source.mjs <<'JS'
          import { readFile, stat } from 'node:fs/promises'

          const required = [
            'web/index.html', 'web/styles.css', 'web/dub.css', 'web/quality.css',
            'web/runtime-bootstrap.js', 'web/data.js', 'web/app.js', 'web/quality.js',
            'web/product-shell.js', 'web/model.json', 'web/LICENSE', 'web/README.md',
            'web/schemas/oia-project.schema.json', 'desktop/main.cjs',
            'desktop/preload.cjs', 'desktop/build.cjs', 'desktop/product-catalog.json',
            'scripts/qa-oia-lib.mjs', 'scripts/qa-oia-tests.mjs',
            'scripts/qa-oia.mjs', 'scripts/qa-oia-products.mjs'
          ]
          for (const path of required) {
            const info = await stat(path)
            if (!info.isFile() || info.size === 0) throw new Error(`Missing or empty required file: ${path}`)
          }
          for (const path of ['web/model.json', 'web/manifest.webmanifest', 'web/schemas/oia-project.schema.json', 'desktop/product-catalog.json', 'package.json']) {
            JSON.parse(await readFile(path, 'utf8'))
          }
          const catalog = JSON.parse(await readFile('desktop/product-catalog.json', 'utf8'))
          if (catalog.products.length !== 16) throw new Error(`Expected 16 interconnected products, found ${catalog.products.length}`)
          if (new Set(catalog.products.map((item) => item.id)).size !== catalog.products.length) throw new Error('Duplicate product identifier')
          const sourceText = await Promise.all(required.filter((path) => !path.endsWith('.json')).map((path) => readFile(path, 'utf8')))
          const joined = sourceText.join('\n')
          if (/[–—]/u.test(joined)) throw new Error('Unicode dash found in public source')
          if (/BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY/.test(joined)) throw new Error('Private key material detected')
          const index = await readFile('web/index.html', 'utf8')
          if (!index.includes('quality.css')) throw new Error('Accessibility correction stylesheet is not loaded')
          const app = await readFile('web/app.js', 'utf8')
          if (!app.includes('data-testid="plant-mode"')) throw new Error('Plant mode test and operator contract is missing')
          if (!app.includes('role="progressbar"')) throw new Error('Phase progress semantics are missing')
          console.log('Source verified: complete web suite, 16 products, desktop shell and release contracts.')
          JS

          cat > README.md <<'MD'
          # Open Industrial Automation

          Open Industrial Automation is an Apache-2.0, vendor-neutral software suite for industrial automation engineering, HMI and SCADA, control intent, tags and I/O, alarms, historian, OEE, batch and MES, materials, maintenance, validation, OT cybersecurity, identity, deployment and legacy migration.

          ## Product family

          The complete suite and 15 focused products share one portable automation project model and one local workspace. Browser and desktop editions are built from the same verified source.

          ## Software boundary

          This repository provides production-grade software, packaging, schemas, evidence and deployment automation. A production plant installation still requires site-specific PLC or DCS engineering, independently engineered functional safety, qualified hardware, network segmentation, protocol configuration, FAT, SAT and commissioning.

          ## Verify

          ```bash
          npm ci
          npm run test
          ```

          ## Desktop packages

          Windows, macOS and Linux packages are generated by GitHub Actions from `desktop/product-catalog.json` for the complete suite and each focused product.

          ## Licence

          Apache License 2.0. See `LICENSE`.
          MD

          cat > .gitignore <<'EOF'
          node_modules/
          desktop/node_modules/
          dist/
          .DS_Store
          *.log
          /tmp/
          EOF

          cat > .editorconfig <<'EOF'
          root = true
          [*]
          charset = utf-8
          end_of_line = lf
          insert_final_newline = true
          indent_style = space
          indent_size = 2
          trim_trailing_whitespace = true
          EOF

      - name: Apply test-driven fixes for the recorded release failures
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          index = Path('web/index.html')
          text = index.read_text()
          if 'quality.css' not in text:
              text = text.replace('<link rel="stylesheet" href="./dub.css">', '<link rel="stylesheet" href="./dub.css">\n  <link rel="stylesheet" href="./quality.css">')
          index.write_text(text)

          app = Path('web/app.js')
          text = app.read_text()
          text = text.replace('<div><span>Mode</span><strong>${escapeHtml(process.mode)}</strong></div>', '<div><span>Mode</span><strong data-testid="plant-mode">${escapeHtml(process.mode)}</strong></div>')
          text = text.replace('<div class="progress-track" aria-label="Current phase progress"><span style="width:${process.progress}%"></span></div>', '<div class="progress-track" role="progressbar" aria-label="Current phase progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${number(process.progress, 0)}"><span style="width:${process.progress}%"></span></div>')
          app.write_text(text)

          shell = Path('web/product-shell.js')
          text = shell.read_text()
          text = text.replace('name: "OIA Suite",', 'name: "Open Industrial Automation Suite",', 1)
          text = text.replace('document.title = `${moduleTitle} - ${product.name}`;', "document.title = productId === 'suite' ? `${moduleTitle} - Open Industrial Automation Suite` : `${moduleTitle} - ${product.name}`;")
          shell.write_text(text)

          quality = Path('web/quality.js')
          text = quality.read_text()
          marker = '  function improveDynamicSemantics(root) {'
          helper = '''  function improveScrollableRegions(root) {\n    root.querySelectorAll('.table-scroll, .hmi-stage-scroll, .process-mimic, .chart-wrap, .studio-canvas').forEach((region, index) => {\n      if (!region.hasAttribute('tabindex')) region.setAttribute('tabindex', '0');\n      if (!region.hasAttribute('role')) region.setAttribute('role', 'region');\n      if (!region.hasAttribute('aria-label')) region.setAttribute('aria-label', `Scrollable engineering content ${index + 1}`);\n    });\n  }\n\n'''
          if 'function improveScrollableRegions' not in text:
              text = text.replace(marker, helper + marker)
              text = text.replace('    labelModuleButtons(root);', '    labelModuleButtons(root);\n    improveScrollableRegions(root);')
          quality.write_text(text)

          css = Path('web/quality.css')
          text = css.read_text()
          text += '''\n\n/* Release 2.2.1 accessibility and Dub-light corrections. */\n.brand-lockup strong { color: #ffffff; }\n.brand-lockup span,\n.module-group-label,\n.module-button span,\n.module-button small,\n.rail-footer p { color: #d4e1e4; }\n.module-button[aria-current="page"] span,\n.module-button[aria-current="page"] small { color: #ffffff; }\nhtml[data-theme="light"] {\n  --muted: #404040;\n  --faint: #525252;\n  --line: #d4d4d4;\n  --line-strong: #a3a3a3;\n  --good: #166534;\n  --warning: #9a3412;\n  --danger: #991b1b;\n  --info: #1e40af;\n}\nhtml[data-theme="light"] th,\nhtml[data-theme="light"] dt,\nhtml[data-theme="light"] .metric-card small,\nhtml[data-theme="light"] .trace-node span,\nhtml[data-theme="light"] .recipe-row span,\nhtml[data-theme="light"] .binding-row span { color: #404040; }\nhtml[data-theme="light"] .good { color: #166534 !important; }\nhtml[data-theme="light"] .warning { color: #9a3412 !important; }\nhtml[data-theme="light"] .danger { color: #991b1b !important; }\nhtml[data-theme="light"] .info { color: #1e40af !important; }\n.table-scroll:focus-visible,\n.hmi-stage-scroll:focus-visible,\n.process-mimic:focus-visible,\n.chart-wrap:focus-visible,\n.studio-canvas:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }\n'''
          css.write_text(text)

          for path in ['desktop/main.cjs', 'desktop/build.cjs']:
              p = Path(path)
              text = p.read_text()
              text = text.replace("path.resolve(__dirname, '..', 'public', 'open-industrial-automation')", "path.resolve(__dirname, '..', 'web')")
              text = text.replace("path.join(repositoryRoot, 'public', 'open-industrial-automation')", "path.join(repositoryRoot, 'web')")
              text = text.replace('https://github.com/Sajeevanveeriah/sajeevanveeriah.github.io/tree/main/public/open-industrial-automation', 'https://github.com/Sajeevanveeriah/open-industrial-automation')
              p.write_text(text)

          lib = Path('scripts/qa-oia-lib.mjs')
          text = lib.read_text().replace("const exportRoot = resolve('out')", "const exportRoot = resolve('dist')").replace("const localPrefix = '/open-industrial-automation'", "const localPrefix = ''")
          lib.write_text(text)

          for path in ['web/data.js', 'web/model.json', 'desktop/product-catalog.json', 'desktop/package.json']:
              p = Path(path)
              text = p.read_text().replace('2.2.0', '2.2.1')
              p.write_text(text)
          PY

      - name: Create standalone CI, Pages, desktop and release workflows
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/ci.yml <<'YAML'
          name: OIA quality
          on:
            push:
              branches: [main, release/oia-standalone-v2.2.1-20260902]
            pull_request:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            quality:
              runs-on: ubuntu-24.04
              timeout-minutes: 35
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npm run verify:source
                - run: npm run build
                - run: npx playwright install --with-deps chromium
                - run: npm run test:web
                - run: npm run test:products
                - run: npm --prefix desktop ci
                - run: npm run desktop:verify
                - run: npm audit --omit=dev --audit-level=high
                - uses: actions/upload-artifact@v4
                  if: always()
                  with:
                    name: oia-quality-${{ github.sha }}
                    path: |
                      /tmp/oia-qa
                      /tmp/oia-product-qa
                    if-no-files-found: warn
                    retention-days: 30
          YAML

          cat > .github/workflows/pages.yml <<'YAML'
          name: Deploy OIA web
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
            pages: write
            id-token: write
          concurrency:
            group: pages
            cancel-in-progress: false
          jobs:
            verify-and-deploy:
              runs-on: ubuntu-24.04
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npm run verify:source
                - run: npm run build
                - uses: actions/configure-pages@v5
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: dist
                - id: deployment
                  uses: actions/deploy-pages@v4
          YAML

          cat > .github/workflows/desktop.yml <<'YAML'
          name: Build OIA desktop products
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            build:
              strategy:
                fail-fast: false
                matrix:
                  include:
                    - os: windows-2025
                      platform: windows
                      arch: x64
                    - os: macos-15-intel
                      platform: mac
                      arch: universal
                    - os: ubuntu-24.04
                      platform: linux
                      arch: x64
              runs-on: ${{ matrix.os }}
              timeout-minutes: 90
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                - run: npm --prefix desktop ci
                - run: node desktop/verify.cjs
                - name: Build complete suite
                  shell: bash
                  env:
                    OIA_PRODUCT: suite
                    OIA_PLATFORM: ${{ matrix.platform }}
                    OIA_ARCH: ${{ matrix.arch }}
                  run: node desktop/build.cjs
                - uses: actions/upload-artifact@v4
                  with:
                    name: oia-suite-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
                    path: dist/installers/${{ matrix.platform }}/suite/**
                    if-no-files-found: error
                    retention-days: 30
          YAML

          cat > .github/workflows/release.yml <<'YAML'
          name: Build source release
          on:
            push:
              tags: ['v*']
            workflow_dispatch:
          permissions:
            contents: write
          jobs:
            source-release:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npm run verify:source
                - run: npm run build
                - name: Build release archives and checksums
                  run: |
                    set -euo pipefail
                    mkdir -p release
                    tar -czf release/Open-Industrial-Automation-2.2.1-Source.tar.gz --exclude=node_modules --exclude=desktop/node_modules --exclude=dist .
                    (cd dist && zip -qr ../release/Open-Industrial-Automation-2.2.1-Web.zip .)
                    sha256sum release/* > release/SHA256SUMS.txt
                - uses: actions/upload-artifact@v4
                  with:
                    name: oia-source-release-${{ github.sha }}
                    path: release/**
                    if-no-files-found: error
          YAML

      - name: Generate lockfiles and verify the complete standalone candidate
        id: qa
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm --prefix desktop install --package-lock-only --ignore-scripts
          npm ci
          npm run verify:source
          npm run build
          npx playwright install --with-deps chromium
          npm run test:web
          npm run test:products
          npm --prefix desktop ci
          npm run desktop:verify

      - name: Materialise the standalone repository for direct repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/00-bootstrap-standalone.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: migrate and repair Open Industrial Automation 2.2.1'
          git push origin HEAD:release/oia-standalone-v2.2.1-20260902

      - name: Preserve the quality gate
        if: ${{ steps.qa.outcome != 'success' }}
        run: |
          echo 'The migrated source was committed, but the complete quality gate failed and requires direct repair.' >&2
          exit 1
