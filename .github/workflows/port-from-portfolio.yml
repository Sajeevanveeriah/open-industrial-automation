name: Port Open Industrial Automation from portfolio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/port-from-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oia-standalone-port
  cancel-in-progress: false

jobs:
  port:
    if: ${{ !contains(github.event.head_commit.message, '[oia-port-complete]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out authoritative OIA source from portfolio commit
        uses: actions/checkout@v4
        with:
          repository: Sajeevanveeriah/sajeevanveeriah.github.io
          ref: 9db11e5ff2ed097ba7ec7537aec776179e04983a
          path: _portfolio
          persist-credentials: false

      - name: Materialise standalone repository
        shell: bash
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name _portfolio \
            -exec rm -rf {} +

          mkdir -p public scripts desktop docs .github/workflows
          cp -a _portfolio/public/open-industrial-automation public/open-industrial-automation
          cp -a _portfolio/desktop/. desktop/
          cp -a _portfolio/scripts/qa-oia-lib.mjs scripts/
          cp -a _portfolio/scripts/qa-oia-tests.mjs scripts/
          cp -a _portfolio/scripts/qa-oia.mjs scripts/
          cp -a _portfolio/scripts/qa-oia-products.mjs scripts/

          if [ -d _portfolio/docs/superpowers ]; then
            mkdir -p docs/superpowers
            cp -a _portfolio/docs/superpowers/. docs/superpowers/
          fi

          cp public/open-industrial-automation/LICENSE LICENSE
          cp public/open-industrial-automation/SECURITY.md SECURITY.md
          cp public/open-industrial-automation/CONTRIBUTING.md CONTRIBUTING.md
          rm -rf _portfolio

      - name: Repair standalone source contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('public/open-industrial-automation/app.js')
          text = app.read_text(encoding='utf-8')
          text = text.replace(
              "document.title = `${module.label} - OIA Suite`;",
              "document.title = `${module.label} - Open Industrial Automation Suite`;",
          )
          text = text.replace(
              '<div><span>Mode</span><strong>${escapeHtml(process.mode)}</strong></div>',
              '<div><span>Mode</span><strong data-testid="plant-mode">${escapeHtml(process.mode)}</strong></div>',
          )
          text = text.replace(
              '<div class="progress-track" aria-label="Current phase progress">',
              '<div class="progress-track" role="progressbar" aria-label="Current phase progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(process.progress)}">',
          )
          text = text.replace(
              'class="table-scroll"',
              'class="table-scroll" tabindex="0" role="region" aria-label="Scrollable data table"',
          )
          text = text.replace(
              'class="hmi-stage-scroll"',
              'class="hmi-stage-scroll" tabindex="0" role="region" aria-label="HMI design canvas"',
          )
          app.write_text(text, encoding='utf-8')

          main = Path('desktop/main.cjs')
          text = main.read_text(encoding='utf-8')
          text = text.replace(
              'https://github.com/Sajeevanveeriah/sajeevanveeriah.github.io/tree/main/public/open-industrial-automation',
              'https://github.com/Sajeevanveeriah/open-industrial-automation',
          )
          text = text.replace(
              'https://sajeevanveeriah.github.io/open-industrial-automation/#documentation',
              'https://sajeevanveeriah.github.io/open-industrial-automation/#documentation',
          )
          main.write_text(text, encoding='utf-8')

          fixes = Path('public/open-industrial-automation/release-fixes.css')
          existing = fixes.read_text(encoding='utf-8') if fixes.exists() else ''
          existing += '''\n\n/* Standalone release contrast and focus hardening. */\nhtml[data-theme="light"] {\n  --text: #171717;\n  --text-strong: #0a0a0a;\n  --muted: #404040;\n  --faint: #525252;\n}\nhtml[data-theme="dark"] {\n  --text: #f5f5f5;\n  --text-strong: #ffffff;\n  --muted: #e5e5e5;\n  --faint: #d4d4d4;\n}\n.module-button, .module-button > span, .module-button small,\n.module-group-label, .rail-footer p, .brand-lockup strong, .brand-lockup span {\n  opacity: 1 !important;\n}\n.table-scroll, .hmi-stage-scroll, .process-mimic {\n  scroll-margin: 12px;\n}\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation: none !important;\n    transition: none !important;\n  }\n}\n'''
          fixes.write_text(existing, encoding='utf-8')

          index = Path('public/open-industrial-automation/index.html')
          html = index.read_text(encoding='utf-8')
          if './release-fixes.css' not in html:
              html = html.replace('<link rel="stylesheet" href="./quality.css">', '<link rel="stylesheet" href="./quality.css">\n  <link rel="stylesheet" href="./release-fixes.css">')
          if './release-fixes.js' not in html:
              html = html.replace('<script src="./product-shell.js"></script>', '<script src="./product-shell.js"></script>\n  <script src="./release-fixes.js"></script>')
          index.write_text(html, encoding='utf-8')

      - name: Create standalone build and release files
        shell: bash
        run: |
          set -euo pipefail

          cat > package.json <<'JSON'
          {
            "name": "open-industrial-automation",
            "version": "2.2.1",
            "private": false,
            "description": "Open-source industrial automation engineering, HMI, SCADA, MES, historian, maintenance, quality and OT governance suite.",
            "license": "Apache-2.0",
            "type": "module",
            "scripts": {
              "build": "node scripts/build-static.mjs",
              "test": "npm run verify && npm run qa:all",
              "verify": "node scripts/verify-source.mjs && node desktop/verify.cjs",
              "qa:oia": "node scripts/qa-oia.mjs",
              "qa:products": "node scripts/qa-oia-products.mjs",
              "qa:all": "npm run build && npm run qa:oia && npm run qa:products"
            },
            "devDependencies": {
              "axe-core": "4.12.1",
              "playwright": "1.62.0"
            }
          }
          JSON

          cat > scripts/build-static.mjs <<'JS'
          import { cp, mkdir, rm } from 'node:fs/promises'
          import { resolve } from 'node:path'

          const source = resolve('public/open-industrial-automation')
          const output = resolve('out/open-industrial-automation')
          await rm(resolve('out'), { recursive: true, force: true })
          await mkdir(output, { recursive: true })
          await cp(source, output, { recursive: true })
          console.log(`Built static suite at ${output}`)
          JS

          cat > scripts/verify-source.mjs <<'JS'
          import assert from 'node:assert/strict'
          import { readFile, stat } from 'node:fs/promises'

          const required = [
            'public/open-industrial-automation/index.html',
            'public/open-industrial-automation/app.js',
            'public/open-industrial-automation/data.js',
            'public/open-industrial-automation/styles.css',
            'public/open-industrial-automation/dub.css',
            'public/open-industrial-automation/release-fixes.css',
            'public/open-industrial-automation/release-fixes.js',
            'public/open-industrial-automation/model.json',
            'public/open-industrial-automation/products/index.html',
            'desktop/product-catalog.json'
          ]
          for (const file of required) assert.ok((await stat(file)).size > 0, `${file} is missing or empty`)
          const app = await readFile('public/open-industrial-automation/app.js', 'utf8')
          const index = await readFile('public/open-industrial-automation/index.html', 'utf8')
          assert.match(app, /data-testid="plant-mode"/)
          assert.match(app, /Open Industrial Automation Suite/)
          assert.match(index, /release-fixes\.css/)
          assert.match(index, /release-fixes\.js/)
          assert.doesNotMatch(`${app}\n${index}`, /[–—]/)
          console.log('Standalone source contracts verified.')
          JS

          cat > README.md <<'MD'
          # Open-Industrial-Automation

          Open-Industrial-Automation is an Apache-2.0 industrial software platform and reference implementation covering operator HMI, SCADA-oriented workflows, control engineering, tags and I/O, alarm management, historian analytics, OEE, batch and MES, materials, maintenance, validation, OT cybersecurity, identity, deployment and migration.

          ## Current release boundary

          The browser and desktop applications are deterministic engineering, simulation and integration products. They are suitable for project design, configuration, training, virtual commissioning and adapter development. A real plant deployment additionally requires independently engineered PLC or DCS control, safety functions, protocol adapters, network segmentation, hardware selection, FAT, SAT and commissioning.

          ## Run

          ```bash
          npm ci
          npm run build
          npx playwright install chromium
          npm test
          ```

          Static output is written to `out/open-industrial-automation`.

          Desktop applications are built from `desktop/` by the GitHub Actions release workflow for Windows, macOS and Linux.

          ## Licence

          Apache License 2.0. See `LICENSE`.
          MD

          cat > .gitignore <<'EOF'
          node_modules/
          desktop/node_modules/
          out/
          dist/
          /tmp/
          *.log
          .DS_Store
          Thumbs.db
          EOF

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          (cd desktop && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)

      - name: Create standalone CI workflow
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: OIA CI

          on:
            pull_request:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: oia-ci-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              runs-on: ubuntu-24.04
              timeout-minutes: 35
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci --ignore-scripts
                - run: npm run verify
                - run: npm run build
                - run: npx playwright install --with-deps chromium
                - run: npm run qa:oia
                - run: npm run qa:products
                - name: Upload QA evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: oia-qa-${{ github.sha }}
                    path: /tmp/oia-qa
                    if-no-files-found: warn
                    retention-days: 30
          YAML

      - name: Create GitHub Pages workflow
        shell: bash
        run: |
          cat > .github/workflows/pages.yml <<'YAML'
          name: Deploy OIA Pages

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: false

          jobs:
            build:
              runs-on: ubuntu-24.04
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci --ignore-scripts
                - run: npm run verify
                - run: npm run build
                - run: npx playwright install --with-deps chromium
                - run: npm run qa:oia
                - uses: actions/configure-pages@v5
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: out/open-industrial-automation
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-24.04
              needs: build
              steps:
                - name: Deploy
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML

      - name: Create desktop installer workflow
        shell: bash
        run: |
          cat > .github/workflows/desktop.yml <<'YAML'
          name: Build OIA desktop installers

          on:
            pull_request:
              paths: ['public/**', 'desktop/**', '.github/workflows/desktop.yml']
            push:
              branches: [main]
              paths: ['public/**', 'desktop/**', '.github/workflows/desktop.yml']
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                    cache-dependency-path: desktop/package-lock.json
                - run: npm ci --ignore-scripts
                  working-directory: desktop
                - run: npm test
                  working-directory: desktop

            build:
              needs: validate
              strategy:
                fail-fast: false
                matrix:
                  include:
                    - platform: linux
                      runner: ubuntu-24.04
                      arch: x64
                    - platform: windows
                      runner: windows-latest
                      arch: x64
                    - platform: mac
                      runner: macos-15-intel
                      arch: universal
              runs-on: ${{ matrix.runner }}
              timeout-minutes: 60
              env:
                OIA_PRODUCT: suite
                OIA_PLATFORM: ${{ matrix.platform }}
                OIA_ARCH: ${{ matrix.arch }}
                CSC_IDENTITY_AUTO_DISCOVERY: 'false'
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                    cache-dependency-path: desktop/package-lock.json
                - run: npm ci --ignore-scripts
                  working-directory: desktop
                - run: npm run build
                  working-directory: desktop
                - name: Generate checksums
                  shell: bash
                  run: |
                    set -euo pipefail
                    find dist/installers -type f -print0 | sort -z | xargs -0 sha256sum > "dist/OIA-suite-${{ matrix.platform }}-SHA256SUMS.txt"
                - uses: actions/upload-artifact@v4
                  with:
                    name: OIA-suite-${{ matrix.platform }}-${{ matrix.arch }}
                    path: |
                      dist/installers/**
                      dist/OIA-suite-${{ matrix.platform }}-SHA256SUMS.txt
                    if-no-files-found: error
                    retention-days: 90
          YAML

      - name: Validate port before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check public/open-industrial-automation/app.js
          node --check public/open-industrial-automation/data.js
          node --check public/open-industrial-automation/runtime-bootstrap.js
          node --check public/open-industrial-automation/product-shell.js
          node --check public/open-industrial-automation/release-fixes.js
          node --check scripts/qa-oia-lib.mjs
          node --check scripts/qa-oia-tests.mjs
          node --check scripts/qa-oia.mjs
          node --check scripts/qa-oia-products.mjs
          npm ci --ignore-scripts
          npm run verify
          npm run build
          test -s out/open-industrial-automation/index.html

      - name: Commit standalone repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: port Open Industrial Automation into standalone repository [oia-port-complete]'
          git push origin HEAD:main
