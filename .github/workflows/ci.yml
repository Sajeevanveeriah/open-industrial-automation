name: OIA quality

on:
  push:
    branches:
      - main
      - release/oia-standalone-v2.2.1-20260902
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:simulation
      - run: npm run verify:source
      - run: npm run build
      - run: npm run test:delivery
      - run: npx playwright install --with-deps chromium
      - run: npm run test:migration
      - run: npm run test:simulation-ui
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oia-quality-${{ github.sha }}
          path: |
            /tmp/oia-qa
          if-no-files-found: warn
          retention-days: 30

