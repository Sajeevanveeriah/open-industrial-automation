name: Clean Windows workshop acceptance
on:
  pull_request:
    paths:
      - 'windows/**'
      - 'simulator/workshop/**'
      - 'scripts/build.mjs'
      - '.github/workflows/workshop-clean-windows.yml'
  workflow_dispatch:
    inputs:
      published_installer:
        description: Test the installer published for the checked-out version
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  clean-install:
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix windows
      - run: node windows/node_modules/electron/install.js
      - run: npm test --prefix windows
      - if: inputs.published_installer != true
        working-directory: windows
        run: node node_modules/electron-builder/cli.js --win nsis --x64 --publish never
      - name: Retrieve and authenticate published installer
        if: inputs.published_installer == true
        working-directory: windows
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $name = "OIA-Workshop-$version-Windows-x64.exe"
          $expected = ((Get-Content "verification/Windows-$version-SHA256.txt" -Raw).Trim() -split '\s+')
          if ($expected.Count -ne 2 -or $expected[1] -ne $name) { throw 'Invalid release checksum record' }
          New-Item -ItemType Directory -Force release | Out-Null
          Invoke-WebRequest "https://github.com/Sajeevanveeriah/open-industrial-automation/releases/download/workshop-v$version/$name" -OutFile "release/$name"
          $actual = (Get-FileHash "release/$name").Hash
          if ($actual -ne $expected[0]) { throw 'Published binary checksum mismatch' }
          Write-Output "Tested release input $name SHA256 $actual"
      - name: Install on the clean runner and check the packaged app
        working-directory: windows
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem release/OIA-Workshop-*-Windows-x64.exe)
          if ($installer.Count -ne 1) { throw 'Expected one installer' }
          $installation = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S','/currentuser' -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw "Installation failed with exit code $($installation.ExitCode)" }
          $link = Get-ChildItem "$env:APPDATA/Microsoft/Windows/Start Menu/Programs" -Filter 'Industrial Engineering Workshop.lnk' -Recurse | Select-Object -First 1
          if (!$link) { throw 'Missing Start menu shortcut' }
          $exe = (New-Object -ComObject WScript.Shell).CreateShortcut($link.FullName).TargetPath
          if (!(Test-Path -LiteralPath $exe)) { throw 'Shortcut target missing' }
          node verify.cjs $exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node verify-jobs.cjs $exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $saved = (Get-FileHash evidence-local/windows-roundtrip.json).Hash
          $uninstaller = Join-Path (Split-Path $exe) 'Uninstall Industrial Engineering Workshop.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S','/currentuser' -Wait -PassThru
          if ($uninstall.ExitCode) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          if ((Get-FileHash evidence-local/windows-roundtrip.json).Hash -ne $saved) { throw 'Uninstall altered learner project' }
          Write-Output "Fresh Windows Server runner clean install, offline project interchange and preservation passed."
