name: Workshop browser compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            browser: safari
          - os: ubuntu-24.04
            browser: firefox
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: matrix.browser == 'safari'
        run: sudo safaridriver --enable
      - run: python3 scripts/workshop-webdriver.py ${{ matrix.browser }}
  studio-chromium:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify the factory floor from the built site
        shell: bash
        run: |
          python3 -m http.server 8080 --bind localhost --directory dist &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://localhost:8080/ > /dev/null
          node scripts/proving-ground-ui.mjs
      - run: npm run test:studio
