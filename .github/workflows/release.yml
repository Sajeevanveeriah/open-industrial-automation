name: Release OIA

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-and-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:source
      - run: npm run build
      - name: Create release archives and SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tar -czf release/20260902-Open-Industrial-Automation-2.2.1-Source-Rev00.tar.gz \
            --exclude=.git --exclude=node_modules --exclude=desktop/node_modules --exclude=dist --exclude=release .
          (cd dist && zip -qr ../release/20260902-Open-Industrial-Automation-2.2.1-Web-Rev00.zip .)
          npm sbom --sbom-format=spdx > release/20260902-Open-Industrial-Automation-2.2.1-SBOM-Rev00.spdx.json
          sha256sum release/* > release/20260902-Open-Industrial-Automation-2.2.1-SHA256SUMS-Rev00.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OIA-2.2.1-source-web-${{ github.sha }}
          path: release/**
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub release for a tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release -type f -print0 | sort -z)
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Open Industrial Automation ${GITHUB_REF_NAME}" \
            --notes "Verified source and browser distribution. Desktop installer artefacts are produced independently for Windows, macOS and Linux. Plant deployment still requires site-specific control, safety and commissioning engineering." \
            --target "$GITHUB_SHA"
