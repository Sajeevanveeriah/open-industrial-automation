name: Deploy OIA web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: oia-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:simulation
      - run: npm run verify:source
      - run: npm run build
      - run: npm run test:delivery
      - run: npx playwright install --with-deps chromium
      - run: npm run test:migration
      - run: npm run test:simulation-ui
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the public deployment
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "${site}/?build=${GITHUB_SHA}" > /tmp/oia-live-index.html \
              && grep -q 'potato-spatial-7' /tmp/oia-live-index.html \
              && curl --fail --silent --show-error --location \
                --header 'Cache-Control: no-cache' \
                "${site}/release.json?build=${GITHUB_SHA}" | grep -q "${GITHUB_SHA}"; then
              echo "Public deployment became available on attempt ${attempt}."
              exit 0
            fi
            sleep 10
          done
          echo "Public deployment did not pass HTTP and content checks." >&2
          exit 1
      - name: Run browser QA against the deployed site
        shell: bash
        env:
          OIA_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          export OIA_BASE_URL="${OIA_BASE_URL%/}"
          npm run test:simulation-ui
      - name: Upload live deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OIA-live-QA-${{ github.sha }}
          path: /tmp/oia-qa
          if-no-files-found: error
          retention-days: 90

