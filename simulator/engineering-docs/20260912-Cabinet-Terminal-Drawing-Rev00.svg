<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">EL-002 | Packing cabinet signal connections</title><desc id="desc">Original conceptual potato plant drawing. Not for construction. Read the accompanying engineering specification and schedules.</desc><style>text{font-family:Arial,sans-serif;fill:#1e293b}rect{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}path{fill:none;stroke:#2563a6;stroke-width:2}</style><rect width="1200" height="840" fill="white"/><text x="35" y="45" font-size="25">EL-002 | Packing cabinet signal connections</text><text x="35" y="72" font-size="14">POTATO PROCESS STUDY | CONCEPT ONLY | NOT FOR CONSTRUCTION</text><text x="40" y="125" font-size="18">CP-14 / PACKING | Representative drawing; use wiring schedule for all 15 cabinets</text><rect x="45" y="160" width="250" height="46" rx="3"/><text x="57" y="188" font-size="15">PKG-1301.READY</text><path d="M295 183H790V183"/><rect x="420" y="160" width="160" height="46" rx="3"/><text x="432" y="188" font-size="15">X14:1</text><text x="315" y="174" font-size="12">W14-1</text><rect x="790" y="160" width="325" height="46" rx="3"/><text x="802" y="188" font-size="15">%I13.0</text><rect x="45" y="235" width="250" height="46" rx="3"/><text x="57" y="263" font-size="15">PKG-1301.PE</text><path d="M295 258H790V258"/><rect x="420" y="235" width="160" height="46" rx="3"/><text x="432" y="263" font-size="15">X14:2</text><text x="315" y="249" font-size="12">W14-2</text><rect x="790" y="235" width="325" height="46" rx="3"/><text x="802" y="263" font-size="15">%I13.1</text><rect x="45" y="310" width="250" height="46" rx="3"/><text x="57" y="338" font-size="15">PKG-1301.OL</text><path d="M295 333H790V333"/><rect x="420" y="310" width="160" height="46" rx="3"/><text x="432" y="338" font-size="15">X14:3</text><text x="315" y="324" font-size="12">W14-3</text><rect x="790" y="310" width="325" height="46" rx="3"/><text x="802" y="338" font-size="15">%I13.2</text><rect x="45" y="385" width="250" height="46" rx="3"/><text x="57" y="413" font-size="15">PKG-1301.RUN</text><path d="M295 408H790V408"/><rect x="420" y="385" width="160" height="46" rx="3"/><text x="432" y="413" font-size="15">X14:4</text><text x="315" y="399" font-size="12">W14-4</text><rect x="790" y="385" width="325" height="46" rx="3"/><text x="802" y="413" font-size="15">%Q13.0</text><rect x="45" y="460" width="250" height="46" rx="3"/><text x="57" y="488" font-size="15">PKG-1301.SPEED</text><path d="M295 483H790V483"/><rect x="420" y="460" width="160" height="46" rx="3"/><text x="432" y="488" font-size="15">X14:5</text><text x="315" y="474" font-size="12">W14-5</text><rect x="790" y="460" width="325" height="46" rx="3"/><text x="802" y="488" font-size="15">%QW90</text><rect x="45" y="535" width="250" height="46" rx="3"/><text x="57" y="563" font-size="15">PKG-1301.TEMP</text><path d="M295 558H790V558"/><rect x="420" y="535" width="160" height="46" rx="3"/><text x="432" y="563" font-size="15">X14:6</text><text x="315" y="549" font-size="12">W14-6</text><rect x="790" y="535" width="325" height="46" rx="3"/><text x="802" y="563" font-size="15">%IW90</text><text x="40" y="655" font-size="14">READY = equipment ready; PE = photoeye signal; OL = overload healthy; RUN = output.</text><text x="40" y="683" font-size="14">SPEED = analogue demand; TEMP = illustrative temperature signal. PE signal is not protective earth.</text><text x="40" y="711" font-size="14">Each displayed line represents one model signal. Actual multi-core power/return/shield wiring is not specified.</text><path d="M25 750H1175"/><text x="35" y="780" font-size="15">20260912 / Rev00 | Original model-derived drawing | Units: SI | Not to scale</text><text x="35" y="810" font-size="14">Illustrative equipment and topology. Manufacturer pinouts, protection sizing and site validation are outstanding.</text></svg>