<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">EL-001 | Typical equipment cabinet power and safety concept</title><desc id="desc">Original conceptual potato plant drawing. Not for construction. Read the accompanying engineering specification and schedules.</desc><style>text{font-family:Arial,sans-serif;fill:#1e293b}rect{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}path{fill:none;stroke:#2563a6;stroke-width:2}</style><rect width="1200" height="840" fill="white"/><text x="35" y="45" font-size="25">EL-001 | Typical equipment cabinet power and safety concept</text><text x="35" y="72" font-size="14">POTATO PROCESS STUDY | CONCEPT ONLY | NOT FOR CONSTRUCTION</text><rect x="40" y="120" width="200" height="70" rx="3"/><text x="52" y="148" font-size="15">415 V AC supply</text><rect x="290" y="120" width="200" height="70" rx="3"/><text x="302" y="148" font-size="15">QF1 isolation</text><rect x="540" y="120" width="240" height="70" rx="3"/><text x="552" y="148" font-size="15">Branch protection</text><path d="M240 155H290V155"/><path d="M490 155H540V155"/><path d="M780 155H900V290"/><rect x="850" y="290" width="270" height="70" rx="3"/><text x="862" y="318" font-size="15">VFD / motor M1</text><path d="M490 155H490V320"/><rect x="360" y="320" width="260" height="70" rx="3"/><text x="372" y="348" font-size="15">PS1 / 24 V DC</text><path d="M620 355H760V470"/><rect x="670" y="470" width="320" height="70" rx="3"/><text x="682" y="498" font-size="15">PLC / remote I/O / sensors</text><rect x="40" y="475" width="440" height="75" rx="3"/><text x="52" y="503" font-size="15">Safety function / torque removal</text><text x="55" y="530" font-size="14">Independent of standard PLC logic</text><path d="M480 510H565V245H985V290"/><rect x="40" y="630" width="1080" height="50" rx="3"/><text x="52" y="658" font-size="15">Protective earth: incoming PE -> cabinet -> door -> motor frames</text><text x="40" y="595" font-size="15">Protection ratings, conductor sizes, fault levels and safety performance are intentionally unspecified.</text><path d="M25 750H1175"/><text x="35" y="780" font-size="15">20260912 / Rev00 | Original model-derived drawing | Units: SI | Not to scale</text><text x="35" y="810" font-size="14">Illustrative equipment and topology. Manufacturer pinouts, protection sizing and site validation are outstanding.</text></svg>